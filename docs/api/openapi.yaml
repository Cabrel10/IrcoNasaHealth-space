openapi: 3.0.3
info:
  title: IRCO Backend API
  version: 0.1.0
  description: Implemented API subset; see contracts/api.md for planned routes.
servers:
  - url: http://localhost:3080
security:
  - bearerAuth: []
paths:
  /openapi.json:
    get:
      operationId: getOpenApiDocument
      security: []
      responses:
        "200":
          description: The OpenAPI document for the implemented API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoReplay"
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Current API, database, and optional-service status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /version:
    get:
      operationId: getVersion
      security: []
      responses:
        "200":
          description: API and server version.
          content:
            application/json:
              schema:
                type: object
                required: [version, api_version]
                properties:
                  version:
                    type: string
                  api_version:
                    type: string
  /api/v1/health:
    get:
      operationId: getApiHealth
      responses:
        "200":
          description: Health status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/rules:
    get:
      operationId: getRules
      responses:
        "200":
          description: Loaded deterministic rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesDocument"
  /api/v1/admin/rules/reload:
    post:
      operationId: reloadDeterministicRules
      description: Validate and atomically replace active rules from the configured rules file without restarting the server.
      responses:
        "200":
          description: The new ruleset is active.
          content:
            application/json:
              schema:
                type: object
                required: [version, rules_loaded]
                properties:
                  version: { type: string }
                  rules_loaded: { type: integer }
        "422":
          description: The configured rule file is missing, invalid, or semantically inconsistent; active rules are unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/admin/colab/register:
    post:
      operationId: registerColabRuntime
      description: Legacy direct registration, used only when the existing heartbeat registry is not configured.
      security:
        - colabAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ColabRegistrationRequest" }
      responses:
        "200":
          description: The runtime was registered and a one-time heartbeat token was issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ColabRegistration" }
        "401":
          description: Invalid administrator token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Colab registration is disabled because no administrator token is configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: revokeColabRuntime
      description: Revoke the active Colab runtime and its heartbeat token.
      security:
        - colabAdminAuth: []
      responses:
        "200":
          description: The active runtime was revoked.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: boolean }
        "401":
          description: Invalid administrator token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/admin/colab/heartbeat:
    post:
      operationId: heartbeatColabRuntime
      description: Legacy direct-session heartbeat, used only when the existing heartbeat registry is not configured.
      security:
        - colabSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ColabHeartbeatRequest" }
      responses:
        "200":
          description: The runtime heartbeat was accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ColabStatus" }
        "401":
          description: The session is invalid, revoked, or expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/colab/status:
    get:
      operationId: getColabStatus
      description: Reports the active runtime from the existing heartbeat registry when configured; never returns its URL or API key.
      responses:
        "200":
          description: Current runtime liveness; secrets and upstream URLs are never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ColabStatus" }
  /api/v1/colab/capabilities:
    get:
      operationId: getColabCapabilities
      description: Reports currently supported chat capability for the active runtime.
      responses:
        "200":
          description: Current runtime liveness and advertised module capabilities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ColabStatus" }
  /api/v1/indicators:
    get:
      operationId: listIndicators
      responses:
        "200":
          description: The loaded indicator registry.
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
        "503":
          description: Indicator registry is not loaded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/indicators/{indicator_id}:
    get:
      operationId: getIndicator
      parameters:
        - in: path
          name: indicator_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Registered indicator metadata and validation provenance.
          content:
            application/json:
              schema: { type: object }
        "404":
          description: Indicator is not registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/indicators/{indicator_id}/history:
    get:
      operationId: getIndicatorHistory
      description: Historical time series with baseline, trend, and thresholds for a single indicator.
      parameters:
        - in: path
          name: indicator_id
          required: true
          schema: { type: string }
          description: Indicator ID from the registry (e.g., heart_rate, radiation_dose_daily)
        - in: query
          name: subject
          schema: { type: string }
          description: Subject identifier; can also use subject_id or scenario
        - in: query
          name: subject_id
          schema: { type: string }
        - in: query
          name: scenario
          schema: { type: string, enum: [a01, nominal, dropout] }
          description: Demo scenario; maps to A-01, N-01, or D-01
        - in: query
          name: data_class
          required: true
          schema: { type: string, enum: [measured_real, analog, synthetic] }
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
        - in: query
          name: day
          schema: { type: integer, minimum: 1 }
          description: Specific mission day for demo scenarios
        - in: query
          name: as_of
          schema: { type: string, format: date-time }
          description: UTC timestamp for historical cutoff
      responses:
        "200":
          description: Historical measurements with computed baseline, trend, thresholds, and data quality
          content:
            application/json:
              schema:
                type: object
                required: [subject_id, indicator, unit, data_class, period, measurements, thresholds, data_quality]
                properties:
                  subject_id: { type: string }
                  indicator: { type: string }
                  unit: { type: string }
                  data_class: { type: string, enum: [measured_real, analog, synthetic] }
                  period:
                    type: object
                    properties:
                      from: { type: string, format: date-time, nullable: true }
                      to: { type: string, format: date-time, nullable: true }
                  measurements:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp: { type: string, format: date-time }
                        value: { type: number }
                        quality: { type: string }
                        source: { type: string }
                  baseline:
                    type: object
                    nullable: true
                    properties:
                      mean: { type: number }
                      median: { type: number }
                      standard_deviation: { type: number }
                      sample_count: { type: integer }
                  trend:
                    type: object
                    nullable: true
                    properties:
                      direction: { type: string }
                      slope_per_day: { type: number }
                      minimum: { type: number }
                      maximum: { type: number }
                      mean: { type: number }
                  thresholds:
                    type: object
                    properties:
                      reference_min: { type: number, nullable: true }
                      reference_max: { type: number, nullable: true }
                      reference_source: { type: string }
                      status: { type: string }
                  data_quality:
                    type: object
                    properties:
                      valid: { type: integer }
                      suspect: { type: integer }
                      total: { type: integer }
        "400":
          description: Invalid query parameters or missing data_class
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Indicator not found in registry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Indicator registry not loaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/state:
    get:
      operationId: getHealthOverview
      description: Requires an explicit data class; subjects from different data classes are never combined.
      parameters:
        - in: query
          name: data_class
          required: true
          schema:
            type: string
            enum: [measured_real, analog, synthetic]
        - in: query
          name: as_of
          description: Optional UTC evaluation time used for freshness rules; defaults to the current time.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Current health state for subjects with observations in the requested data class.
          content:
            application/json:
              schema:
                type: object
                required: [data_class, subjects]
                properties:
                  data_class:
                    type: string
                    enum: [measured_real, analog, synthetic]
                  subjects:
                    type: array
                    items:
                      $ref: "#/components/schemas/HealthState"
        "400":
          description: Missing or invalid data class.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/state/{subject_id}:
    get:
      operationId: getSubjectHealthState
      description: Requires an explicit data class. Missing-data rules are evaluated against as_of (or the current UTC time); no_data means no valid current measurement is available.
      parameters:
        - in: path
          name: subject_id
          required: true
          schema: { type: string }
        - in: query
          name: data_class
          required: true
          schema:
            type: string
            enum: [measured_real, analog, synthetic]
        - in: query
          name: as_of
          description: Optional UTC evaluation time used for freshness rules; defaults to the current time.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Latest values, descriptive temporal trends, alerts, and rule coverage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthState" }
  /api/v1/mission:
    get:
      operationId: getMission
      description: Mission metadata
      responses:
        "200":
          description: Mission information
          content:
            application/json:
              schema:
                type: object
                properties:
                  mission_id: { type: string }
                  name: { type: string }
                  start_date: { type: string, format: date-time }
                  duration_days: { type: integer }
                  crew_size: { type: integer }
                  subject_id: { type: string }
                  environment: { type: string }
                  earth_delay_min: { type: integer }
                  simulated: { type: boolean }
  /api/v1/routine:
    get:
      operationId: getRoutine
      description: Daily routine tasks for a subject
      parameters:
        - in: query
          name: subject_id
          schema: { type: string, default: A-01 }
        - in: query
          name: date
          schema: { type: string, format: date }
          description: YYYY-MM-DD format, defaults to today
      responses:
        "200":
          description: Routine tasks and progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject_id: { type: string }
                  date: { type: string }
                  tasks: { type: array, items: { type: object } }
                  progress: { type: object }
  /api/v1/routine/done:
    post:
      operationId: markRoutineDone
      description: Mark a routine task as completed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_id, task_id]
              properties:
                subject_id: { type: string }
                task_id: { type: string }
                completed_at: { type: string, format: date-time }
      responses:
        "200":
          description: Task completion persisted
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject_id: { type: string }
                  task_id: { type: string }
                  completed_at: { type: string, format: date-time }
                  date: { type: string, format: date }
                  status: { type: string }
  /api/v1/checkin:
    post:
      operationId: checkin
      description: Validate and persist a manual measurement through the standard ingestion and alert-evaluation path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_id, indicator, value, unit]
              properties:
                subject_id: { type: string }
                indicator: { type: string }
                value: { type: number }
                unit: { type: string }
                timestamp: { type: string, format: date-time }
      responses:
        "200":
          description: Measurement stored in the observation history and sent to dashboard event subscribers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  measurement_id: { type: string }
                  subject_id: { type: string }
                  indicator: { type: string }
                  value: { type: number }
                  unit: { type: string }
                  timestamp: { type: string, format: date-time }
                  data_class: { type: string, enum: [measured_real] }
                  quality: { type: object }
                  status: { type: string }
                  persisted: { type: boolean }
                  alerts_created: { type: integer }
                  notice: { type: string }
        "400":
          description: Invalid JSON, timestamp, or unit mismatch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Indicator not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Indicator registry unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/dashboard:
    get:
      operationId: getDashboard
      description: Returns a live snapshot from persisted observations by default. Demo mode is deterministic and synthetic. No real values are fabricated or interpolated.
      parameters:
        - in: query
          name: subject
          schema: { type: string, default: A-01 }
          description: Subject identifier; alias for subject_id.
        - in: query
          name: subject_id
          schema: { type: string }
        - in: query
          name: mode
          schema: { type: string, enum: [real, demo], default: real }
          description: Real mode reads persisted observations; demo mode uses deterministic synthetic replay.
        - in: query
          name: data_class
          schema:
            type: string
            enum: [measured_real, analog, synthetic]
        - in: query
          name: scenario
          schema:
            type: string
            enum: [a01, nominal, dropout]
        - in: query
          name: day
          schema: { type: integer, minimum: 1, maximum: 124 }
        - in: query
          name: as_of
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Complete dashboard snapshot for one subject and one data class.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
              example:
                subject_id: A-01
                mode: demo
                data_class: synthetic
                mission:
                  mission_id: IRCO-DEMO
                  mission_day: 1
                  environment: deep_space
                  earth_delay_min: 12
                  mode: autonomous
                  simulated: true
                global:
                  level: green
                  confidence: low_synthetic
                  badges: [simulated]
                indicators:
                  - id: heart_rate
                    value: 62
                    unit: bpm
                    last_updated: "2026-01-01T06:00:00Z"
                    trend: insufficient_data
                    quality: synthetic
                    measurement_quality: valid
                    data_class: synthetic
                    status: fresh
                    data_status: fresh
                    source: SYNTHETIC_A01
                    spark: [62]
                    history:
                      - { timestamp: "2026-01-01T06:00:00Z", value: 62, quality: valid }
                    baseline: null
                    expected_frequency: "continuous or daily"
                    age_seconds: 0
                    threshold_status: illustrative
                    thresholds: { reference_min: 40, reference_max: 120 }
                  - id: co2_cabin
                    value: null
                    unit: ppm
                    last_updated: null
                    trend: no_data
                    quality: synthetic
                    measurement_quality: no_data
                    data_class: synthetic
                    status: no_data
                    data_status: no_data
                    source: null
                    spark: []
                    history: []
                    baseline: null
                    expected_frequency: "1min"
                    age_seconds: null
                    threshold_status: illustrative
                    thresholds: { reference_min: 0.0, reference_max: 5000.0 }
                active_alerts: []
                triggered_rules: []
                anomalies:
                  available: false
                  items: []
                  reason: No validated anomaly detector is configured.
                clinical_assessment:
                  available: false
                  diagnoses: []
                  reason: IRCO does not diagnose diseases.
                hazards:
                  - { id: radiation, level: no_data, indicators: [] }
                  - { id: isolation, level: no_data, indicators: [] }
                  - { id: hostile_environment, level: no_data, indicators: [] }
                  - { id: distance_from_earth, level: no_data, indicators: [] }
                  - { id: altered_gravity, level: no_data, indicators: [] }
                routine:
                  subject_id: A-01
                  date: "2026-01-01"
                  tasks:
                    - { id: morning-vitals, name: Morning Vitals Check, category: health, due_time: "08:00", completed: false, priority: high }
                    - { id: exercise-cardio, name: Cardiovascular Exercise, category: exercise, duration_min: 30, due_time: "10:00", completed: false, priority: high }
                    - { id: meal-log, name: Meal Log, category: nutrition, due_time: "12:00", completed: false, priority: medium }
                    - { id: mood-checkin, name: Mood Check-in, category: behavioral, due_time: "18:00", completed: false, priority: medium }
                  progress: { completed: 0, total: 4, percentage: 0 }
                data_quality:
                  data_class: synthetic
                  valid: 3
                  suspect: 0
                  no_data: 15
                services:
                  engine: ok
                  ai: offline
                  knowledge: ok
                last_updated: "2026-01-01T06:00:00Z"
                medical_notice: "This service provides traceable decision support, not a medical diagnosis or disease determination."
        "400":
          description: Invalid filters, unsupported scenario, or conflicting time filters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/dashboard/events:
    get:
      operationId: streamDashboardUpdates
      description: Server-Sent Events emitted after successful observation ingestion. Refetch the dashboard after an observations_updated or resync_required event.
      parameters:
        - in: query
          name: subject_id
          required: true
          schema: { type: string }
        - in: query
          name: data_class
          required: true
          schema: { type: string, enum: [measured_real, analog, synthetic] }
      responses:
        "200":
          description: Server-Sent Events stream. Event payloads contain the subject, data class, observation time, and changed indicator IDs.
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                event: observations_updated
                data: {"subject_id":"A-01","data_class":"measured_real","observed_at":"2026-11-15T12:00:00Z","indicators":["heart_rate"]}
        "400":
          description: Missing or invalid stream filters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/observations:
    get:
      operationId: listObservations
      parameters:
        - in: query
          name: subject_id
          schema: { type: string }
        - in: query
          name: indicator
          schema: { type: string }
        - in: query
          name: source
          schema: { type: string }
        - in: query
          name: data_class
          schema:
            type: string
            enum: [measured_real, analog, synthetic]
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 10000, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        "200":
          description: Filtered page of persisted observations.
          content:
            application/json:
              schema:
                type: object
                required: [total_returned, limit, offset, observations]
                properties:
                  total_returned: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
                  observations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Observation"
        "400":
          description: Invalid query parameters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or invalid bearer token when authentication is configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/observations/export:
    get:
      operationId: exportObservations
      parameters:
        - in: query
          name: format
          required: true
          schema:
            type: string
            enum: [json, jsonl, csv]
        - in: query
          name: subject_id
          schema: { type: string }
        - in: query
          name: indicator
          schema: { type: string }
        - in: query
          name: data_class
          schema:
            type: string
            enum: [measured_real, analog, synthetic]
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Filtered export in the requested format.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Observation" } }
            application/x-ndjson:
              schema: { type: string }
            text/csv:
              schema: { type: string }
  /api/v1/ingest:
    post:
      operationId: ingestObservations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observations]
              properties:
                observations:
                  type: array
                  items: { $ref: "#/components/schemas/Observation" }
      responses:
        "200":
          description: Accepted batch and exact duplicate count.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, rejected, errors, duplicates_skipped, alerts_created]
                properties:
                  accepted: { type: integer }
                  rejected: { type: integer }
                  errors:
                    type: array
                    items: { type: string }
                  duplicates_skipped: { type: integer }
                  alerts_created: { type: integer }
        "400":
          description: Malformed JSON or invalid request body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or invalid bearer token when authentication is configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Invalid observation or conflicting observation identifier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/alerts:
    get:
      operationId: listAlerts
      parameters:
        - in: query
          name: subject_id
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Persisted alerts and their audit histories.
          content:
            application/json:
              schema:
                type: object
                required: [alerts, limit, offset]
                properties:
                  alerts:
                    type: array
                    items: { type: object }
                  limit: { type: integer }
                  offset: { type: integer }
  /api/v1/alerts/{alert_id}:
    patch:
      operationId: transitionAlert
      parameters:
        - in: path
          name: alert_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, detail]
              properties:
                state:
                  type: string
                  enum: [created, acknowledged, in_progress, reassessed, closed, escalated]
                detail: { type: string }
      responses:
        "200":
          description: Updated alert with appended audit event.
          content:
            application/json:
              schema: { type: object }
        "404":
          description: Alert not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Illegal transition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/alerts/{alert_id}/followup:
    post:
      operationId: recordAlertFollowup
      parameters:
        - in: path
          name: alert_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observation_id]
              properties:
                observation_id: { type: string }
      responses:
        "200":
          description: Follow-up measurement linked to the alert.
          content:
            application/json:
              schema:
                type: object
                required: [alert_id, followup_measurements]
                properties:
                  alert_id: { type: string }
                  followup_measurements: { type: integer }
        "404":
          description: Alert or observation not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/knowledge/search:
    get:
      operationId: searchScientificCorpus
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: hazard
          schema: { type: string }
        - in: query
          name: indicator
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        "200":
          description: BM25 passages with source citation metadata, or source_not_found.
          content:
            application/json:
              schema:
                type: object
                required: [available, source_not_found, hits]
                properties:
                  available: { type: boolean }
                  source_not_found: { type: boolean }
                  hits:
                    type: array
                    items: { $ref: "#/components/schemas/KnowledgeHit" }
        "503":
          description: Offline corpus is not installed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/assistant/chat:
    post:
      operationId: explainWithCitations
      description: Uses relevant corpus evidence with the active registered Colab runtime when available, otherwise returns a local extractive answer. Optional health context is read-only and never sets vigilance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 2000 }
                hazard: { type: string }
                indicator: { type: string }
                subject_id: { type: string, minLength: 1, maxLength: 200 }
                data_class:
                  type: string
                  enum: [measured_real, analog, synthetic]
      responses:
        "200":
          description: A citation-backed passage or explicit source-not-found answer.
          content:
            application/json:
              schema:
                type: object
                required: [answer, citations, source_not_found, disclaimer, provider]
                properties:
                  answer: { type: string }
                  citations:
                    type: array
                    items: { $ref: "#/components/schemas/Citation" }
                  source_not_found: { type: boolean }
                  disclaimer: { type: string }
                  provider: { type: string }
        "400":
          description: Invalid question, health-context pair, or data class.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/knowledge/health:
    get:
      operationId: getKnowledgeHealth
      responses:
        "200":
          description: Corpus availability and document count.
          content:
            application/json:
              schema:
                type: object
                required: [available, documents, retrieval]
                properties:
                  available: { type: boolean }
                  documents: { type: integer }
                  retrieval: { type: string }
  /api/v1/knowledge/hazards:
    get:
      operationId: listKnowledgeHazards
      responses:
        "200":
          description: Known HRP hazard identifiers.
          content:
            application/json:
              schema: { type: object }
        "503":
          description: Offline corpus is not installed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/knowledge/indicator/{indicator_id}:
    get:
      operationId: getIndicatorKnowledge
      parameters:
        - in: path
          name: indicator_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Source-backed knowledge passages for an indicator.
          content:
            application/json:
              schema:
                type: object
                required: [available, source_not_found, hits]
                properties:
                  available: { type: boolean }
                  source_not_found: { type: boolean }
                  hits:
                    type: array
                    items: { type: object }
  /api/v1/demo/scenarios:
    get:
      operationId: listDemoScenarios
      responses:
        "200":
          description: Offline synthetic scenarios available for replay.
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
  /api/v1/demo/replay:
    get:
      operationId: replayDemoDay
      parameters:
        - in: query
          name: scenario
          schema:
            type: string
            enum: [a01, nominal, dropout]
        - in: query
          name: day
          schema: { type: integer, minimum: 1, maximum: 124, default: 1 }
      responses:
        "200":
          description: Reproducible synthetic observations and vigilance derived from configured deterministic rules for the requested day.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoReplay" }
  /api/v1/demo/scenario:
    get:
      operationId: getDemoScenarioDay
      parameters:
        - in: query
          name: name
          schema:
            type: string
            enum: [a01, nominal, dropout]
        - in: query
          name: day
          schema: { type: integer, minimum: 1, maximum: 124, default: 1 }
      responses:
        "200":
          description: Alias for replaying a scenario day.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoReplay" }
  /api/v1/demo/reset:
    post:
      operationId: resetDemoReplay
      parameters:
        - in: query
          name: scenario
          schema:
            type: string
            enum: [a01, nominal, dropout]
      responses:
        "200":
          description: Return day one of a scenario; replay is stateless.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoReplay" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    colabAdminAuth:
      type: http
      scheme: bearer
      description: IRCO_COLAB_ADMIN_TOKEN; separate from IRCO_API_TOKEN.
    colabSessionAuth:
      type: http
      scheme: bearer
      description: One-time heartbeat token returned by Colab registration.
  schemas:
    DemoReplay:
      type: object
      required:
        [scenario, mission_day, timestamp, observations, missing_indicators, data_class, disclaimer, vigilance, triggered_rules]
      properties:
        scenario: { type: string, enum: [a01, nominal, dropout] }
        mission_day: { type: integer, minimum: 1, maximum: 124 }
        timestamp: { type: string, format: date-time }
        observations:
          type: array
          items: { $ref: "#/components/schemas/Observation" }
        missing_indicators: { type: array, items: { type: string } }
        data_class: { type: string, enum: [synthetic] }
        disclaimer: { type: string }
        vigilance: { type: string, enum: [green, amber, red, no_data] }
        triggered_rules: { type: array, items: { type: string } }
    Health:
      type: object
      required:
       [status, version, uptime_seconds, database, rules_loaded, indicators_loaded, ai_available, colab_available, knowledge_available]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        uptime_seconds: { type: integer }
        database: { type: string, enum: [connected, unavailable] }
        rules_loaded: { type: integer }
        indicators_loaded: { type: integer }
        ai_available: { type: boolean }
        colab_available: { type: boolean }
        knowledge_available: { type: boolean }
    ColabCapabilities:
      type: object
      required: [chat]
      properties:
        chat: { type: boolean }
        asr: { type: boolean, default: false }
        tts: { type: boolean, default: false }
        vision: { type: boolean, default: false }
        vlm: { type: boolean, default: false }
        image: { type: boolean, default: false }
        multi: { type: boolean, default: false }
        streaming: { type: boolean, default: false }
    ColabRegistrationRequest:
      type: object
      required: [api_base, api_key, model, capabilities]
      properties:
        api_base: { type: string, format: uri, pattern: "^https://" }
        api_key: { type: string, minLength: 1, maxLength: 512 }
        model: { type: string, minLength: 1, maxLength: 200 }
        capabilities: { $ref: "#/components/schemas/ColabCapabilities" }
    ColabHeartbeatRequest:
      type: object
      required: [session_id]
      properties:
        session_id: { type: string }
        api_base: { type: string, format: uri, pattern: "^https://" }
        api_key: { type: string, minLength: 1, maxLength: 512 }
        model: { type: string, minLength: 1, maxLength: 200 }
        capabilities: { $ref: "#/components/schemas/ColabCapabilities" }
    ColabRegistration:
      type: object
      required: [session_id, heartbeat_token, ttl_seconds]
      properties:
        session_id: { type: string }
        heartbeat_token: { type: string, description: One-time secret used to authenticate heartbeats. }
        ttl_seconds: { type: integer }
    ColabStatus:
      type: object
      required: [available, session_id, model, capabilities, expires_in_seconds]
      properties:
        available: { type: boolean }
        session_id: { type: string, nullable: true }
        model: { type: string, nullable: true }
        capabilities:
          allOf:
            - $ref: "#/components/schemas/ColabCapabilities"
          nullable: true
        expires_in_seconds: { type: integer, nullable: true }
    Error:
      type: object
      required: [error, code, hint]
      properties:
        error: { type: string }
        code: { type: string }
        hint: { type: string }
    Citation:
      type: object
      required: [document_id, title, publisher, url, section, page_numbers, document_date]
      properties:
        document_id: { type: string }
        title: { type: string }
        publisher: { type: string }
        url: { type: string, format: uri }
        section: { type: string }
        page_numbers: { type: string, nullable: true }
        document_date: { type: string, format: date, nullable: true }
    KnowledgeHit:
      type: object
      required: [score, evidence, evidence_kind, citation, hazard, indicators_related, confidence]
      properties:
        score: { type: number }
        evidence: { type: string }
        evidence_kind: { type: string, enum: [source_excerpt, curated_summary] }
        citation: { $ref: "#/components/schemas/Citation" }
        hazard:
          type: string
          nullable: true
          enum: [radiation, isolation, hostile_environment, distance_from_earth, altered_gravity]
        indicators_related:
          type: array
          items: { type: string }
        confidence:
          type: string
          nullable: true
          enum: [established, supported, hypothesis, preliminary]
    RulesDocument:
      type: object
      required: [version, rules]
      properties:
        version: { type: string }
        rules:
          type: array
          items: { type: object }
    HealthState:
      type: object
      required:
        [subject_id, data_class, as_of, vigilance, supported_vigilance, indicators, missing_indicators, triggered_rules, alerts, thresholds_status, skipped_rules, history_truncated]
      properties:
        subject_id: { type: string }
        data_class:
          type: string
          enum: [measured_real, analog, synthetic]
        as_of: { type: string, format: date-time }
        vigilance:
          type: string
          enum: [green, amber, red, no_data]
        supported_vigilance:
          type: string
          enum: [green, amber, red, no_data]
        indicators:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/IndicatorState"
        missing_indicators: { type: array, items: { type: string } }
        triggered_rules: { type: array, items: { type: string } }
        alerts: { type: array, items: { type: object } }
        last_updated: { type: string, format: date-time, nullable: true }
        thresholds_status:
          type: string
          enum: [validated, provisional, illustrative, not_applicable]
        skipped_rules: { type: array, items: { type: object } }
        history_truncated: { type: boolean }
    Dashboard:
      type: object
      required: [mode, subject_id, data_class, mission, global, indicators, active_alerts, triggered_rules, anomalies, clinical_assessment, hazards, routine, data_quality, services, last_updated, medical_notice]
      properties:
        mode: { type: string, enum: [real, demo] }
        subject_id: { type: string }
        data_class: { type: string, enum: [measured_real, analog, synthetic] }
        mission: { type: object, additionalProperties: true }
        global: { type: object, required: [level, confidence, badges], properties: { level: { type: string, enum: [green, amber, red, no_data] }, confidence: { type: string }, badges: { type: array, items: { type: string } } } }
        indicators:
          type: array
          items:
            type: object
            required: [id, value, unit, last_updated, trend, quality, measurement_quality, data_class, status, data_status, source, spark, history, baseline, threshold_status, thresholds, expected_frequency, age_seconds]
            properties:
              id: { type: string }
              value: { type: number, nullable: true }
              unit: { type: string }
              last_updated: { type: string, format: date-time, nullable: true }
              trend: { type: string }
              quality: { type: string }
              measurement_quality: { type: string }
              data_class: { type: string, enum: [measured_real, analog, synthetic] }
              status: { type: string, enum: [fresh, stale, invalid, no_data] }
              data_status: { type: string, enum: [fresh, stale, invalid, no_data] }
              source: { type: string, nullable: true }
              spark: { type: array, items: { type: number } }
              history: { type: array, items: { type: object, required: [timestamp, value, quality], properties: { timestamp: { type: string, format: date-time }, value: { type: number }, quality: { type: string } } } }
              baseline:
                type: object
                nullable: true
                required: [mean, median, standard_deviation, sample_count]
                properties:
                  mean: { type: number }
                  median: { type: number }
                  standard_deviation: { type: number }
                  sample_count: { type: integer }
              threshold_status: { type: string, enum: [validated, provisional, illustrative, not_applicable] }
              thresholds: { type: object, additionalProperties: { type: number, nullable: true } }
              expected_frequency: { type: string }
              age_seconds: { type: integer, nullable: true }
        active_alerts: { type: array, items: { type: object } }
        triggered_rules: { type: array, items: { type: string } }
        anomalies: { type: object, required: [available, items, reason], properties: { available: { type: boolean }, items: { type: array, items: { type: object } }, reason: { type: string } } }
        clinical_assessment: { type: object, required: [available, diagnoses, reason], properties: { available: { type: boolean }, diagnoses: { type: array, items: { type: object } }, reason: { type: string } } }
        hazards: { type: array, items: { type: object, required: [id, level, indicators], properties: { id: { type: string }, level: { type: string, enum: [green, amber, red, no_data] }, indicators: { type: array, items: { type: string } } } } }
        routine: { type: object, required: [subject_id, date, tasks, progress], properties: { subject_id: { type: string }, date: { type: string, format: date }, tasks: { type: array, items: { type: object } }, progress: { type: object, required: [completed, total, percentage], properties: { completed: { type: integer }, total: { type: integer }, percentage: { type: integer } } } } }
        data_quality: { type: object, required: [data_class, valid, suspect, no_data], properties: { data_class: { type: string, enum: [measured_real, analog, synthetic] }, valid: { type: integer }, suspect: { type: integer }, no_data: { type: integer } } }
        services: { type: object, required: [engine, ai, knowledge], properties: { engine: { type: string }, ai: { type: string, enum: [online, offline] }, knowledge: { type: string } } }
        last_updated: { type: string, format: date-time }
        medical_notice: { type: string }
    IndicatorState:
      type: object
      required: [latest, unit, last_updated, trend, quality, source, data_status]
      properties:
        latest: { type: number }
        unit: { type: string }
        last_updated: { type: string, format: date-time }
        trend: { type: string }
        slope_per_day: { type: number, nullable: true }
        quality: { type: string }
        source: { type: string }
        data_status: { type: string, enum: [fresh, stale, invalid] }
    Observation:
      type: object
      required: [id, timestamp, indicator, value, unit, source, data_class]
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        subject_id: { type: string, nullable: true }
        indicator: { type: string }
        value: { type: number }
        unit: { type: string }
        source: { type: string }
        data_class:
          type: string
          enum: [measured_real, analog, synthetic]
        context: { type: object }
        provenance: { type: object }
        quality: { type: object }
