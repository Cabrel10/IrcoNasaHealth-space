// Animated counting number using framer-motion imperative animate
function CountUp({ to, duration = 1.6, decimals = 0, suffix = '', prefix = '', className = '' }) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    const controls = fmAnimate(0, to, {
      duration,
      ease: [0.16, 1, 0.3, 1],
      onUpdate: (v) => setVal(v),
    });
    return () => controls.stop();
  }, [to]);
  const formatted = decimals > 0 ? val.toFixed(decimals) : Math.round(val).toString();
  return <span className={className}>{prefix}{formatted}{suffix}</span>;
}

// Live Mission Elapsed Time ticker, starting at 137:14:26:32
function useMET(startD = 137, startH = 14, startM = 26, startS = 32) {
  const [met, setMet] = useState(() => {
    const total = startD * 86400 + startH * 3600 + startM * 60 + startS;
    return total;
  });
  useEffect(() => {
    const id = setInterval(() => setMet((m) => m + 1), 1000);
    return () => clearInterval(id);
  }, []);
  const d = Math.floor(met / 86400);
  const h = Math.floor((met % 86400) / 3600);
  const m = Math.floor((met % 3600) / 60);
  const s = met % 60;
  const pad = (n) => n.toString().padStart(2, '0');
  return `${pad(d)}:${pad(h)}:${pad(m)}:${pad(s)}`;
}

// Starfield of random twinkling dots
function Starfield({ count = 70 }) {
  const stars = useMemo(
    () => Array.from({ length: count }, () => ({
      x: Math.random() * 100,
      y: Math.random() * 100,
      s: Math.random() * 1.6 + 0.4,
      d: Math.random() * 3 + 1,
      delay: Math.random() * 3,
    })),
    [count]
  );
  return (
    <div className="absolute inset-0 overflow-hidden pointer-events-none">
      {stars.map((st, i) => (
        <motion.span
          key={i}
          className="absolute rounded-full bg-white"
          style={{ left: `${st.x}%`, top: `${st.y}%`, width: st.s, height: st.s }}
          animate={{ opacity: [0.15, 0.7, 0.15] }}
          transition={{ duration: st.d, repeat: Infinity, delay: st.delay, ease: 'easeInOut' }}
        />
      ))}
    </div>
  );
}

// Reusable circular progress ring (animates strokeDashoffset on mount)
function CircularProgress({
  value, max = 100, size = 120, stroke = 11, color = '#22d3ee',
  trackColor = 'rgba(148,163,184,0.14)', children, glow = true,
}) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(value / max, 1));
  const offset = c * (1 - pct);
  return (
    <div className="relative inline-flex items-center justify-center" style={{ width: size, height: size }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="rotate-[-90deg]">
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={trackColor} strokeWidth={stroke} />
        <motion.circle
          cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={c}
          initial={{ strokeDashoffset: c }}
          animate={{ strokeDashoffset: offset }}
          transition={{ duration: 1.6, ease: [0.16, 1, 0.3, 1] }}
          style={glow ? { filter: `drop-shadow(0 0 6px ${color}99)` } : undefined}
        />
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">{children}</div>
    </div>
  );
}

// Semicircle radial gauge (for radiation)
function SemicircleGauge({
  value, max, size = 180, stroke = 16, color = '#22d3ee', trackColor = 'rgba(148,163,184,0.14)',
}) {
  const r = (size - stroke) / 2;
  const cx = size / 2;
  const cy = size - stroke / 2 - 4;
  const startX = cx - r, startY = cy;
  const endX = cx + r, endY = cy;
  const path = `M ${startX} ${startY} A ${r} ${r} 0 0 1 ${endX} ${endY}`;
  const len = Math.PI * r;
  const pct = Math.max(0, Math.min(value / max, 1));
  const offset = len * (1 - pct);
  return (
    <svg width={size} height={size * 0.62} viewBox={`0 0 ${size} ${size * 0.62}`}>
      <path d={path} fill="none" stroke={trackColor} strokeWidth={stroke} strokeLinecap="round" />
      <motion.path
        d={path} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round"
        strokeDasharray={len}
        initial={{ strokeDashoffset: len }}
        animate={{ strokeDashoffset: offset }}
        transition={{ duration: 1.6, ease: [0.16, 1, 0.3, 1] }}
        style={{ filter: `drop-shadow(0 0 8px ${color}aa)` }}
      />
      {/* tick marks */}
      {[0, 0.25, 0.5, 0.75, 1].map((t, i) => {
        const ang = Math.PI - t * Math.PI;
        const x1 = cx + (r - stroke / 2 - 2) * Math.cos(ang);
        const y1 = cy - (r - stroke / 2 - 2) * Math.sin(ang);
        const x2 = cx + (r + stroke / 2 + 2) * Math.cos(ang);
        const y2 = cy - (r + stroke / 2 + 2) * Math.sin(ang);
        return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="rgba(148,163,184,0.25)" strokeWidth={1} />;
      })}
    </svg>
  );
}

function HologramBody() {
  const joint = (x, y, key) => <circle key={key} cx={x} cy={y} r="2.4" fill="#67e8f9" opacity="0.9" />;
  return (
    <motion.svg
      width="200" height="380" viewBox="0 0 200 400" fill="none"
      initial={{ opacity: 0 }}
      animate={{ scale: [1, 1.025, 1], opacity: [0.85, 1, 0.85] }}
      transition={{ duration: 3, repeat: Infinity, ease: 'easeInOut' }}

      <defs>
        <radialGradient id="bodyFill" cx="50%" cy="38%" r="62%">
          <stop offset="0%" stopColor="rgba(34,211,238,0.22)" />
          <stop offset="100%" stopColor="rgba(34,211,238,0.02)" />

          <stop offset="0%" stopColor="#fff1f2" />
          <stop offset="40%" stopColor="#fb7185" />
          <stop offset="100%" stopColor="#9f1239" />
        </radialGradient>
        <linearGradient id="boneStroke" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#67e8f9" />
          <stop offset="100%" stopColor="#0891b2" />
        </linearGradient>
      </defs>

      {/* ===== Head ===== */}
      <circle cx="100" cy="44" r="26" fill="url(#bodyFill)" stroke="url(#boneStroke)" strokeWidth="1.6" />

      <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[700px] radial-glow pointer-events-none opacity-70" />

      <Sidebar />

      <div className="flex-1 flex flex-col min-w-0 relative z-10">
        <Header />
        <main className="flex-1 p-3.5 flex flex-col gap-3 min-h-0">
          {/* top 3 columns */}
          <div className="flex-1 grid grid-cols-[210px_1fr_330px] gap-3 min-h-0">
            <CrewPanel />
            <HologramPanel />
            <VitalsPanel />
          </div>
          {/* bottom 5 cards */}
          <BottomMetrics />
        </main>
      </div>
    </div>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<Dashboard />);
</script>
