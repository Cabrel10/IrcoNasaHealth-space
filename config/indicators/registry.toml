# IRCO Indicator Registry v0
#
# This file defines all indicators recognized by the IRCO health engine.
# Adding an indicator here does NOT require recompilation of the Rust engine.
# The engine loads this file at startup and on reload.
#
# Status: illustrative = demo only, provisional = reasonable defaults, validated = peer-reviewed

[format]
version = "0.1.0"

# ─── CARDIOVASCULAR ───────────────────────────────────────────────

[[indicators]]
id = "heart_rate"
name = "Heart Rate"
family = "cardiovascular"
unit = "bpm"
collection_method = "wearable_sensor"
expected_frequency = "continuous or daily"
sources = ["PHYSIONET_MIMIC", "UCI_MHEALTH", "SYNTHETIC_A01", "CREW_MANUAL"]
reference_min = 40.0
reference_max = 120.0
reference_source = "Standard clinical range (rest)"
reference_status = "illustrative"
scientific_refs = ["NASA HRP — Cardiovascular risks in microgravity"]

[[indicators]]
id = "blood_pressure_systolic"
name = "Systolic Blood Pressure"
family = "cardiovascular"
unit = "mmHg"
collection_method = "cuff_measurement"
